<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="chevronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Rounded square container -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <!-- Prompt chevron > -->
  <path d="M 42 36 L 72 60 L 42 84" fill="none" stroke="url(#chevronGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Completeness circle ● -->
  <circle cx="72" cy="60" r="6.5" fill="#f59e0b"/>
  <!-- Cursor line _ -->
  <line x1="42" y1="96" x2="60" y2="96" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
</svg>
